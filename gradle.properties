#gradle build config
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4608M

#use androidX
android.useAndroidX=true
android.enableJetifier=true
# 与 sample 工程保持一致：MSDK aar 的资源引用依赖非命名空间 R 类
android.nonTransitiveRClass=false

# MSDK aar 内部资源存在重复，关闭校验（沿用 sample 工程配置）
android.disableResourceValidation=true

#build config —— 版本号与已调通的 sample 工程完全一致，勿随意升级
ANDROID_MIN_SDK_VERSION=24
ANDROID_TARGET_SDK_VERSION=35
ANDROID_COMPILE_SDK_VERSION=35
KOTLIN_VERSION=2.1.0

#MSDK 版本，与 sample 工程一致
MSDK_VERSION=5.18.0

# MSDK App Key。
# 注意：App Key 与 applicationId 绑死。app/build.gradle 里 applicationId 暂时沿用
# com.dji.sampleV5.aircraft，就是为了直接复用你已经激活验证过的这把 Key，
# 迁移期零重新申请成本。等功能跑通后再一起改包名 + 换新 Key。
AIRCRAFT_API_KEY=Please add your app key here.
