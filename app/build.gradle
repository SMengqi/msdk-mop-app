apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.bxt.mop"
    compileSdkVersion Integer.parseInt(project.ANDROID_COMPILE_SDK_VERSION)

    defaultConfig {
        // 【重要】暂时沿用 sample 的 applicationId，以便复用已激活验证的 App Key。
        // App Key 与包名绑死，改这里就必须回 developer.dji.com 重新申请。
        applicationId "com.dji.sampleV5.aircraft"

        minSdkVersion Integer.parseInt(project.ANDROID_MIN_SDK_VERSION)
        targetSdkVersion Integer.parseInt(project.ANDROID_TARGET_SDK_VERSION)
        versionCode 1
        versionName "1.0"

        manifestPlaceholders["API_KEY"] = project.AIRCRAFT_API_KEY

        ndk {
            // MSDK 只提供 arm64 native 库，必须真机
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            // sample 工程开了 minify 却没配任何 proguard 文件，release 包有崩溃风险。
            // 这里补上规则文件，上线前务必实测 release 包。
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        // 必须与 AndroidManifest 的 android:extractNativeLibs="true" 保持一致。
        // AGP 8 以本 DSL 为准，manifest 里那个属性会被忽略；默认值 false 表示
        // native 库不解压、直接从 APK 映射加载，MSDK 的 .so 在那种模式下会
        // 报 UnsatisfiedLinkError。不配这一项只会出警告，但真机上必炸。
        jniLibs {
            useLegacyPackaging = true
        }

        // mrtc 库使用 NDK c++_shared，与其他库重复，取其一
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'

        // 以下 native 库不可 strip，原样照搬 sample 工程配置，勿删减
        doNotStrip "*/*/libconstants.so"
        doNotStrip "*/*/libdji_innertools.so"
        doNotStrip "*/*/libdjibase.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIFlySafeCore-CSDK.so"
        doNotStrip "*/*/libdjifs_jni-CSDK.so"
        doNotStrip "*/*/libDJIRegister.so"
        doNotStrip "*/*/libdjisdk_jni.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core-CSDK.so"
        doNotStrip "*/*/libdjiwpv2-CSDK.so"
        doNotStrip "*/*/libFlightRecordEngine.so"
        doNotStrip "*/*/libvideo-framing.so"
        doNotStrip "*/*/libwaes.so"
        doNotStrip "*/*/libagora-rtsa-sdk.so"
        doNotStrip "*/*/libc++.so"
        doNotStrip "*/*/libc++_shared.so"
        doNotStrip "*/*/libmrtc_28181.so"
        doNotStrip "*/*/libmrtc_agora.so"
        doNotStrip "*/*/libmrtc_core.so"
        doNotStrip "*/*/libmrtc_core_jni.so"
        doNotStrip "*/*/libmrtc_data.so"
        doNotStrip "*/*/libmrtc_log.so"
        doNotStrip "*/*/libmrtc_onvif.so"
        doNotStrip "*/*/libmrtc_rtmp.so"
        doNotStrip "*/*/libmrtc_rtsp.so"
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    /** <----------------- MSDK --------------------> **/
    implementation "com.dji:dji-sdk-v5-aircraft:${project.MSDK_VERSION}"
    compileOnly "com.dji:dji-sdk-v5-aircraft-provided:${project.MSDK_VERSION}"
    // sample 工程漏了这个依赖。注册激活需要联网，必须加。
    runtimeOnly "com.dji:dji-sdk-v5-networkImp:${project.MSDK_VERSION}"

    /** <----------------- 本工程所需（刻意保持极简，不引入 uxsdk）-------------> **/
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${project.KOTLIN_VERSION}"
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.3.1'
}
